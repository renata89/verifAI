  - id: "GT-009"
    language: python
    ac: |
      Rate limiting should allow 100 requests per minute per API key.
      Exceeding limit should return 429 Too Many Requests.
    code: |
      @app.middleware("http")
      async def rate_limit_middleware(request: Request, call_next):
          api_key = request.headers.get("X-API-Key")
          if api_key:
              key = f"rate_limit:{api_key}"
              count = await redis.incr(key)
              if count == 1:
                  await redis.expire(key, 60)
              if count > 100:
                  return JSONResponse(status_code=429, content={"error": "Rate limit exceeded"})
          return await call_next(request)
    expected:
      ac_status: "implemented"
      explanation: "Implements 100 req/min rate limiting per API key, returns 429 when exceeded."

